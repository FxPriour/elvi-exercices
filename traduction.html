<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translation practice – AI and education</title>
<style>
  :root {
    --ink: #1d2733; --muted: #5b6776; --line: #d9dee5; --paper: #fbfaf7;
    --accent: #1f4e79; --accent-soft: #e8f0f8; --ok: #1e7a46; --ok-soft: #e4f4ea;
    --ko: #b3261e; --ko-soft: #fbe9e7; --warn: #8a5a00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font: 17px/1.55 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  header { background: var(--accent); color: #fff; padding: 2.2rem 1.2rem 1.6rem; }
  header .wrap { max-width: 860px; margin: 0 auto; }
  header h1 { margin: 0 0 .4rem; font-size: 1.7rem; line-height: 1.2; font-weight: 600; }
  header p { margin: 0; opacity: .9; font-size: .98rem; }
  nav { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); }
  nav .wrap { max-width: 860px; margin: 0 auto; display: flex; gap: .3rem; overflow-x: auto; padding: .5rem 1rem; }
  nav a { font: 600 .82rem/1 system-ui, sans-serif; color: var(--accent); text-decoration: none;
    padding: .45rem .7rem; border-radius: 99px; white-space: nowrap; background: var(--accent-soft); }
  nav a:hover { background: #d5e3f1; }
  main { max-width: 860px; margin: 0 auto; padding: 1rem 1rem 4rem; }
  section { margin-top: 2.4rem; scroll-margin-top: 3.5rem; }
  h2 { font-size: 1.35rem; margin: 0 0 .8rem; color: var(--accent); }
  .rule { background: var(--accent-soft); border-left: 4px solid var(--accent); padding: .9rem 1.1rem;
    border-radius: 0 8px 8px 0; margin-bottom: 1.2rem; }
  .rule p { margin: .35rem 0; }
  .rule .ds { margin-top: .6rem; padding-top: .6rem; border-top: 1px dashed #b8c8da; }
  .tag { font: 700 .72rem/1 system-ui, sans-serif; background: var(--accent); color: #fff; padding: .2rem .4rem;
    border-radius: 4px; vertical-align: 2px; margin-right: .3rem; }
  table.ref { border-collapse: collapse; width: 100%; margin: .6rem 0 0; font-size: .95rem; background: #fff; }
  table.ref th, table.ref td { border: 1px solid var(--line); padding: .4rem .6rem; text-align: left; vertical-align: top; }
  table.ref th { background: #eef2f6; font-family: system-ui, sans-serif; font-size: .85rem; }
  .ex { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem 1.1rem; margin-bottom: 1.4rem; }
  .ex h3 { margin: 0 0 .25rem; font-size: 1.05rem; }
  .ex .consigne { margin: 0 0 .8rem; color: var(--muted); font-style: italic; }
  ol.items { margin: 0; padding-left: 1.6rem; }
  ol.items > li { margin: .7rem 0; padding-left: .2rem; }
  .prompt { display: block; margin-bottom: .3rem; }
  input[type=text] { width: 100%; font: inherit; font-size: 1rem; padding: .45rem .6rem; border: 1px solid #b9c2cd;
    border-radius: 6px; background: #fff; color: var(--ink); }
  input[type=text].gap { width: 9rem; display: inline-block; padding: .2rem .4rem; margin: 0 .2rem; }
  textarea { width: 100%; font: inherit; font-size: 1rem; padding: .5rem .6rem; border: 1px solid #b9c2cd;
    border-radius: 6px; min-height: 4.2rem; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 2px solid #8fb3d6; outline-offset: 1px; }
  .choices { display: inline-flex; gap: .3rem; flex-wrap: wrap; }
  .choices label { font-family: system-ui, sans-serif; font-size: .9rem; border: 1px solid #b9c2cd; border-radius: 99px;
    padding: .2rem .7rem; cursor: pointer; background: #fff; user-select: none; }
  .choices input { position: absolute; opacity: 0; pointer-events: none; }
  .choices input:checked + span { font-weight: 700; }
  .choices label:has(input:checked) { background: var(--accent); color: #fff; border-color: var(--accent); }
  select { font: inherit; font-size: .95rem; padding: .15rem .3rem; border: 1px solid #b9c2cd; border-radius: 6px; background: #fff; margin: 0 .15rem; }
  li.ok input[type=text], li.ok select { border-color: var(--ok); background: var(--ok-soft); }
  li.ko input[type=text], li.ko select { border-color: var(--ko); background: var(--ko-soft); }
  li.ok .choices label:has(input:checked) { background: var(--ok); border-color: var(--ok); }
  li.ko .choices label:has(input:checked) { background: var(--ko); border-color: var(--ko); }
  .fb { font-family: system-ui, sans-serif; font-size: .88rem; margin-top: .3rem; }
  .fb .good { color: var(--ok); font-weight: 600; }
  .fb .bad { color: var(--ko); font-weight: 600; }
  .fb .hint { color: var(--warn); display: block; margin-top: .15rem; }
  .bar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-top: 1rem; }
  button { font: 600 .9rem/1 system-ui, sans-serif; padding: .6rem 1rem; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: var(--accent); }
  button:hover { filter: brightness(1.08); }
  .score { font: 700 .95rem system-ui, sans-serif; margin-left: auto; }
  .model { display: none; margin-top: .5rem; padding: .6rem .8rem; background: #f4f7fa; border-radius: 6px; font-size: .95rem; }
  .model.show { display: block; }
  .model .why { color: var(--muted); font-size: .88rem; font-family: system-ui, sans-serif; }
  .checklist { list-style: none; padding: 0; margin: .4rem 0 0; }
  .checklist li { margin: .45rem 0; }
  .checklist label { display: flex; gap: .55rem; align-items: flex-start; cursor: pointer; }
  .checklist input { margin-top: .35rem; width: 1rem; height: 1rem; flex: none; }
  .total { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: .6rem 1rem;
    font: 600 .9rem system-ui, sans-serif; text-align: center; }
  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 0 1rem 2rem; }
  em.en { font-style: italic; }
  @media (max-width: 560px) { body { font-size: 16px; } header h1 { font-size: 1.4rem; } input[type=text].gap { width: 7rem; } }

  details.seg { background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:.8rem; }
  details.seg summary { cursor:pointer; padding:.8rem 1rem; list-style:none; }
  details.seg summary::-webkit-details-marker { display:none; }
  details.seg summary::before { content:"\25B8"; display:inline-block; width:1.1rem; color:var(--accent); transition:transform .15s; }
  details.seg[open] summary::before { transform:rotate(90deg); }
  details.seg .body { padding:0 1rem 1rem 2.1rem; }
  .lbl { font:700 .78rem/1 system-ui,sans-serif; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:.8rem 0 .25rem; }
  .copie { color:var(--ko); font-style:italic; }
  .prop { color:var(--ok); }
  .notes { margin:.2rem 0 0; padding-left:1.1rem; }
  .notes li { margin:.3rem 0; }
  .back { color:#fff; font:600 .85rem system-ui,sans-serif; display:inline-block; margin-bottom:.6rem; opacity:.9; }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="back" href="index.html">← Grammar exercises</a>
  <h1>Translation practice – AI and education</h1>
  <p>These exercises are based on the translation (thème) from your mock exam. Answer, then click “Check”. Your answers are saved in this browser, so you can come back later.</p>
</div></header>
<main>
<section id="s3">
  
  <div class="ex" id="ex1"></div>
  <div class="ex" id="ex2"></div>
  <div class="ex" id="ex3"></div>
  <div class="ex" id="ex4"></div>
</section>
</main>
<div class="total" id="total">Total score: –</div>
<footer>Your answers are saved in this browser. <button class="ghost" id="resetAll" style="margin-left:.4rem">Clear all</button></footer>
<script>
const EX = [{"id": "ex1", "title": "Exercise 1", "type": "gap", "consigne": "Complete the English translation of each French phrase.", "items": [{"fr": "À force de dresser la liste des dangers…", "before": "", "after": "listing the dangers…", "a": ["by dint of", "by constantly", "by repeatedly", "by continually", "by endlessly", "by continuously"]}, {"fr": "Le texte finit par dessiner un horizon quasi prohibitif.", "before": "The text", "after": "sketching an almost prohibitive horizon.", "a": ["ends up"]}, {"fr": "une menace à tenir à distance", "before": "a threat to", "after": "at a distance", "a": ["be kept"]}, {"fr": "Comment prétendre éduquer au discernement ?", "before": "How can we", "after": "to teach discernment?", "a": ["claim"]}, {"fr": "… alors même qu'il circule massivement.", "before": "…", "after": "it is in widespread use.", "a": ["even though", "even as", "although", "though"]}, {"fr": "la quasi-totalité des lycéens", "before": "", "after": "high school students", "a": ["almost all", "nearly all", "virtually all", "practically all"]}, {"fr": "Ils utilisent déjà des IA génératives.", "before": "They", "after": "use generative AI.", "a": ["already"]}, {"fr": "Une minorité seulement y a accès.", "before": "", "after": "a minority have access to it.", "a": ["only"]}, {"fr": "Les enseignants se disent inquiets.", "before": "Teachers", "after": "they are worried.", "a": ["say"]}, {"fr": "Ils souhaitent plutôt une régulation claire qu'une interdiction.", "before": "They would", "after": "have clear regulation than a ban.", "a": ["rather"]}, {"fr": "une interdiction pure et simple", "before": "an", "after": "ban", "a": ["outright"]}, {"fr": "Un autre problème tient au flou des concepts.", "before": "Another problem", "after": "in the vagueness of the concepts.", "a": ["lies"]}]}, {"id": "ex2", "title": "Exercise 2", "type": "choice", "consigne": "False friends and invented words: choose the correct translation.", "items": [{"before": "dresser une liste → ", "opts": ["draw up a list", "dress a list"], "a": 0, "after": ""}, {"before": "prétendre (= affirmer) → ", "opts": ["pretend", "claim"], "a": 1, "after": ""}, {"before": "une menace → ", "opts": ["a threat", "a threaten"], "a": 0, "after": ""}, {"before": "une enquête → ", "opts": ["an investigment", "an inquiry"], "a": 1, "after": ""}, {"before": "la rencontre (entre élèves et IA) → ", "opts": ["the encounter", "the meeting"], "a": 0, "after": ""}, {"before": "l'accoutumance → ", "opts": ["accoutumance", "habituation"], "a": 1, "after": ""}, {"before": "évoquer (= mentionner) → ", "opts": ["refer to", "evoke"], "a": 0, "after": ""}, {"before": "parallèlement → ", "opts": ["moreover", "at the same time"], "a": 1, "after": ""}, {"before": "l'usage personnel → ", "opts": ["personal use", "personal using"], "a": 0, "after": ""}, {"before": "déjà → ", "opts": ["still", "already"], "a": 1, "after": ""}]}, {"id": "ex3", "title": "Exercise 3", "type": "rewrite", "needQuestionMark": true, "consigne": "Translate these questions into English.", "items": [{"q": "Parle-t-on de mémoire ?", "a": ["Are we talking about memory?", "Are we speaking about memory?", "Are we talking of memory?", "Do we mean memory?", "Is it about memory?"]}, {"q": "Comment peut-on enseigner le doute critique ?", "a": ["How can we teach critical doubt?", "How can one teach critical doubt?", "How can we teach critical scepticism?", "How can we teach critical skepticism?"]}, {"q": "Que craignent les enseignants ?", "a": ["What do teachers fear?", "What are teachers afraid of?", "What are teachers worried about?"]}, {"q": "Pourquoi les élèves utilisent-ils l'IA ?", "a": ["Why do students use AI?", "Why do pupils use AI?"]}, {"q": "Qui utilise l'IA en dehors de l'école ?", "a": ["Who uses AI outside school?", "Who uses AI outside of school?"], "why": "Question sur le sujet : pas d'auxiliaire, et -s à la 3e personne."}, {"q": "Les enseignants souhaitent-ils une interdiction ?", "a": ["Do teachers want a ban?", "Do teachers want a prohibition?", "Do teachers wish for a ban?"]}, {"q": "Le texte définit-il la « dépendance cognitive » ?", "a": ["Does the text define cognitive dependence?", "Does the text define cognitive dependency?"]}]}, {"id": "ex4", "title": "Exercise 4", "type": "translate", "consigne": "Translate the passage again, sentence by sentence. Then compare with the suggested translation and the points to check. Click “Show a suggested translation” when you have finished.", "items": [{"q": "Mais à force de dresser la liste des dangers, le texte finit par dessiner un horizon quasi prohibitif.", "m": "But by dint of listing the dangers, the text ends up sketching an almost prohibitive horizon.", "why": "à force de → by dint of / by + V-ing ; finir par → end up + V-ing ; ne pas oublier « horizon »."}, {"q": "L'IA y apparaît surtout comme une menace à tenir à distance, plus que comme un objet d'enquête et de déconstruction en classe.", "m": "In it, AI appears chiefly as a threat to be kept at a distance, rather than as an object of inquiry and deconstruction in the classroom.", "why": "a threat (nom) ; to be kept at a distance ; an object of inquiry ; ne rien ajouter."}, {"q": "Or comment prétendre éduquer au discernement sans organiser, dans un cadre sécurisé, la rencontre entre élèves et IA ?", "m": "Yet how can we claim to teach discernment without organising, in a safe setting, an encounter between students and AI?", "why": "claim (et non pretend) ; teach discernment ; a safe setting ; an encounter."}, {"q": "Comment former au doute critique sur un outil que l'on condamne à rester invisible dans la salle de classe, alors même qu'il circule massivement dans les usages personnels ?", "m": "How can we train students in critical doubt about a tool that we condemn to remain invisible in the classroom, even though it is in widespread personal use?", "why": "traduire « former » et « critique » ; relatif sans its ; even though ; personal use."}, {"q": "En réalité, la quasi-totalité des lycéens et étudiants utilisent déjà des IA génératives en dehors de l'école, tandis qu'une minorité seulement y a accès dans un environnement encadré et explicité.", "m": "In reality, almost all secondary school and university students already use generative AI outside school, whereas only a minority have access to it in a supervised environment where its use is made explicit.", "why": "almost all ; already (et non still) ; outside school ; traduire toute la phrase."}, {"q": "Parallèlement, une majorité d'enseignants se disent inquiets, mais souhaitent plutôt une régulation claire qu'une interdiction pure et simple, jugée illusoire.", "m": "At the same time, most teachers say they are worried, but would rather have clear regulation than an outright ban, which they consider unrealistic.", "why": "at the same time ; say they are ; would rather… than ; an outright ban."}, {"q": "Entre l'angoisse d'une école « dévorée par l'IA » et le fait accompli des usages privés, le risque est que les élèves apprennent avec l'IA, mais contre l'école et non avec elle.", "m": "Between fears of a school 'devoured by AI' and the fait accompli of private use, there is a risk that students will learn with AI, but against school rather than with it.", "why": "fears of ; fait accompli ; AI sans article ; there is a risk that."}, {"q": "Un autre problème tient au flou de certains concepts mobilisés.", "m": "Another problem lies in the vagueness of some of the concepts used.", "why": "problem ; lies in ; vagueness ; used."}, {"q": "La motion évoque, par exemple, une « dépendance cognitive » sans la définir : parle-t-on d'accoutumance, d'atrophie de la mémoire, d'une délégation trop rapide de la réflexion ?", "m": "The motion refers, for example, to 'cognitive dependence' without defining it: are we talking about habituation, memory atrophy, or handing over our thinking too quickly?", "why": "refer to ; cognitive dependence ; are we talking about…? ; habituation ; memory atrophy."}]}];
/* ---------- Outils ---------- */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('theme-' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('theme-' + k, JSON.stringify(v)); } catch (e) {} },
  clear() { try { Object.keys(localStorage).filter(k => k.startsWith('theme-')).forEach(k => localStorage.removeItem(k)); } catch (e) {} },
};
function norm(s) {
  return (s || '').toLowerCase()
    .replace(/[‘’ʼ`´]/g, "'").replace(/[“”]/g, '"')
    .replace(/\bcan't\b/g, 'cannot').replace(/\bcan not\b/g, 'cannot')
    .replace(/\bdon't\b/g, 'do not').replace(/\bdoesn't\b/g, 'does not').replace(/\bdidn't\b/g, 'did not')
    .replace(/\bisn't\b/g, 'is not').replace(/\baren't\b/g, 'are not').replace(/\bwon't\b/g, 'will not')
    .replace(/\bit's\b/g, 'it is').replace(/\bshouldn't\b/g, 'should not').replace(/\bcouldn't\b/g, 'could not')
    .replace(/[.,;:!?"()]/g, ' ').replace(/\s+/g, ' ').trim();
}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const scores = {};

/* ---------- Rendu ---------- */
function render(ex) {
  const box = document.getElementById(ex.id);
  const saved = store.get(ex.id) || {};
  let h = `<h3>${ex.title}</h3><p class="consigne">${ex.consigne}</p><ol class="items">`;
  ex.items.forEach((it, i) => {
    const v = saved[i];
    if (ex.type === 'rewrite') {
      const val = v != null ? v : (ex.prefill ? it.start : '');
      h += `<li data-i="${i}"><span class="prompt">${esc(it.q)}</span>
        <input type="text" autocomplete="off" spellcheck="false" value="${esc(val)}"><div class="fb"></div></li>`;
    } else if (ex.type === 'choice') {
      h += `<li data-i="${i}">${esc(it.before)}<span class="choices">` +
        it.opts.map((o, j) => `<label><input type="radio" name="${ex.id}-${i}" value="${j}" ${v == j ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('') +
        `</span>${esc(it.after)}<div class="fb"></div></li>`;
    } else if (ex.type === 'gap') {
      h += `<li data-i="${i}">${it.fr ? `<span class="prompt"><em>${esc(it.fr)}</em></span>` : ''}${esc(it.before)} ${it.hint ? `<em>${esc(it.hint)}</em>` : ''}
        <input type="text" class="gap" ${ex.wide ? 'style="width:12rem"' : ''} autocomplete="off" spellcheck="false" value="${esc(v || '')}"> ${esc(it.after)}<div class="fb"></div></li>`;
    } else if (ex.type === 'article') {
      let s = '';
      it.parts.forEach((p, k) => {
        s += esc(p);
        if (k < it.parts.length - 1) {
          const cur = v ? v[k] : '';
          const cap = k === 0 && p === '';
          s += `<select data-k="${k}"><option value="">…</option><option value="Ø" ${cur === 'Ø' ? 'selected' : ''}>Ø</option><option value="the" ${cur === 'the' ? 'selected' : ''}>${cap ? 'The' : 'the'}</option></select>`;
        }
      });
      h += `<li data-i="${i}">${s}<div class="fb"></div></li>`;
    } else if (ex.type === 'translate') {
      h += `<li data-i="${i}"><span class="prompt">${esc(it.q)}</span>
        <textarea spellcheck="false">${esc(v || '')}</textarea>
        <div class="model"><div>${it.m}</div><div class="why">Points to check: ${it.why}</div></div></li>`;
    }
  });
  h += '</ol><div class="bar">';
  if (ex.type === 'translate') {
    h += `<button data-act="show">Show a suggested translation</button><button class="ghost" data-act="reset">Clear</button>`;
  } else {
    h += `<button data-act="check">Check</button><button class="ghost" data-act="solution">Show answers</button><button class="ghost" data-act="reset">Clear</button><span class="score"></span>`;
  }
  h += '</div>';
  box.innerHTML = h;

  box.addEventListener('input', () => save(ex));
  box.addEventListener('change', () => save(ex));
  box.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); check(ex); } });
  box.querySelector('.bar').addEventListener('click', e => {
    const act = e.target.dataset.act; if (!act) return;
    if (act === 'check') check(ex);
    if (act === 'solution') check(ex, true);
    if (act === 'show') box.querySelectorAll('.model').forEach(m => m.classList.toggle('show'));
    if (act === 'reset') { store.set(ex.id, {}); delete scores[ex.id]; render(ex); updateTotal(); }
  });
}

function read(ex, li) {
  if (ex.type === 'rewrite' || ex.type === 'gap') return li.querySelector('input').value;
  if (ex.type === 'translate') return li.querySelector('textarea').value;
  if (ex.type === 'choice') { const r = li.querySelector('input:checked'); return r ? +r.value : null; }
  if (ex.type === 'article') return [...li.querySelectorAll('select')].map(s => s.value);
}
function save(ex) {
  const box = document.getElementById(ex.id), data = {};
  box.querySelectorAll('li[data-i]').forEach(li => data[li.dataset.i] = read(ex, li));
  store.set(ex.id, data);
}

function check(ex, reveal = false) {
  const box = document.getElementById(ex.id);
  let ok = 0;
  box.querySelectorAll('li[data-i]').forEach(li => {
    const it = ex.items[li.dataset.i], v = read(ex, li), fb = li.querySelector('.fb');
    let good = false, expected = '', hint = '';
    if (ex.type === 'rewrite') {
      good = it.a.some(a => norm(a) === norm(v));
      expected = it.a[0];
      if (ex.noQuestionMark && /\?\s*$/.test(v)) { good = false; hint = 'Pas de point d’interrogation : ce n’est pas une question.'; }
      if (ex.needQuestionMark && good && !/\?\s*$/.test(v)) hint = 'N’oublie pas le point d’interrogation.';
    } else if (ex.type === 'gap') {
      good = it.a.some(a => norm(a) === norm(v)); expected = it.a.join(' / ');
    } else if (ex.type === 'choice') {
      good = v === it.a; expected = it.opts[it.a];
    } else if (ex.type === 'article') {
      good = it.a.every((a, k) => v[k] === a); expected = it.a.join(' … ');
    }
    if (good) ok++;
    li.classList.toggle('ok', good); li.classList.toggle('ko', !good);
    const empty = v == null || (typeof v === 'string' && !v.trim()) || (Array.isArray(v) && v.some(x => !x));
    if (good) fb.innerHTML = `<span class="good">✓ Correct</span>` + (it.why ? ` – ${it.why}` : '') + (hint ? `<span class="hint">${hint}</span>` : '');
    else if (reveal || !empty) fb.innerHTML = `<span class="bad">✗</span> ${reveal || !empty ? 'Expected answer: <b>' + esc(expected) + '</b>' : ''}` + (it.why ? ` – ${it.why}` : '') + (hint ? `<span class="hint">${hint}</span>` : '');
    else fb.innerHTML = `<span class="bad">Not answered</span>`;
  });
  scores[ex.id] = [ok, ex.items.length];
  box.querySelector('.score').textContent = `${ok} / ${ex.items.length}`;
  updateTotal();
}
function updateTotal() {
  const v = Object.values(scores);
  if (!v.length) { document.getElementById('total').textContent = 'Total score: –'; return; }
  const ok = v.reduce((a, b) => a + b[0], 0), n = v.reduce((a, b) => a + b[1], 0);
  document.getElementById('total').textContent = `Total score (checked exercises): ${ok} / ${n}`;
}

/* Listes de méthode */
document.querySelectorAll('.checklist').forEach(ul => {
  const k = ul.dataset.key, saved = store.get(k) || [];
  const boxes = ul.querySelectorAll('input');
  boxes.forEach((b, i) => { b.checked = !!saved[i]; b.addEventListener('change', () => store.set(k, [...boxes].map(x => x.checked))); });
});

EX.forEach(render);
document.getElementById('resetAll').addEventListener('click', () => {
  if (!confirmReset()) return;
  store.clear(); for (const k in scores) delete scores[k];
  EX.forEach(render); document.querySelectorAll('.checklist input').forEach(b => b.checked = false); updateTotal();
});
function confirmReset() {
  const b = document.getElementById('resetAll');
  if (b.dataset.armed) { delete b.dataset.armed; b.textContent = 'Clear all'; return true; }
  b.dataset.armed = '1'; b.textContent = 'Click again to confirm';
  setTimeout(() => { delete b.dataset.armed; b.textContent = 'Clear all'; }, 3000);
  return false;
}
</script>
</body>
</html>
